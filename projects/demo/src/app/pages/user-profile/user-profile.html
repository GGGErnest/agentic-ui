<div class="profile-tabs">
  <button type="button" class="tab-btn" [class.active]="activeTab() === 'identity'" (click)="switchTab('identity')">
    Identity
  </button>
  <button type="button" class="tab-btn" [class.active]="activeTab() === 'preferences'" (click)="switchTab('preferences')">
    Preferences
  </button>
  <button type="button" class="tab-btn" [class.active]="activeTab() === 'activity'" (click)="switchTab('activity')">
    Activity
  </button>
</div>

@if (activeTab() === 'identity') {
  <app-profile-identity agentic />
}
@if (activeTab() === 'preferences') {
  <app-profile-preferences agentic />
}
@if (activeTab() === 'activity') {
  <app-profile-activity agentic />
}
